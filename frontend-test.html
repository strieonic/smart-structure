<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Test</title>
</head>
<body>
    <h1>Frontend JavaScript Test</h1>
    <div id="test-results"></div>
    
    <script>
        // Test frontend JavaScript functionality
        async function testFrontend() {
            const results = [];
            
            // Test 1: Check if main functions exist
            const functionsToCheck = [
                'showSection',
                'switchTab', 
                'showToast',
                'selectAccountType',
                'switchExpertTab',
                'nextStep',
                'prevStep',
                'validateCurrentStep',
                'registerExpert',
                'expertLogin',
                'login',
                'register',
                'logout'
            ];
            
            functionsToCheck.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    results.push(`✅ Function ${funcName} exists`);
                } else {
                    results.push(`❌ Function ${funcName} missing`);
                }
            });
            
            // Test 2: Check if required DOM elements exist
            const elementsToCheck = [
                'toast-container',
                'user-auth-card',
                'expert-auth-card',
                'expert-queries-section',
                'expert-dashboard-section'
            ];
            
            elementsToCheck.forEach(elementId => {
                if (document.getElementById(elementId)) {
                    results.push(`✅ Element #${elementId} exists`);
                } else {
                    results.push(`❌ Element #${elementId} missing`);
                }
            });
            
            // Display results
            document.getElementById('test-results').innerHTML = results.join('<br>');
        }
        
        // Load the main script and test
        const script = document.createElement('script');
        script.src = 'script.js?v=5.0';
        script.onload = () => {
            setTimeout(testFrontend, 1000);
        };
        script.onerror = () => {
            document.getElementById('test-results').innerHTML = '❌ Failed to load script.js';
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
